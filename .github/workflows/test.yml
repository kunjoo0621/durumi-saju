# 사주 사실 정합성 게이트.
#
# 왜 있는가: 12신살 년주 기준 버그가 2026-02-22 커밋부터 6개월간 아무도
# 모른 채 라이브로 나갔다. 사전·엔진·프롬프트가 서로 어긋나도 알려 주는
# 장치가 없었기 때문이다. 손으로 안 돌려도 무조건 돌게 만든다.
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # ★사주 엔진은 프로세스 TZ가 **UTC** 인 것을 전제로 한다(직관과 반대다).
    #   @gracefullight/saju 는 "한국 벽시계를 UTC 인 척 인코딩한" 공간에서 계산한다 —
    #   어댑터가 timeZone 을 무시하고 로컬 필드를 읽고(adapters/date-fns.js:34-40)
    #   절기 탐색이 그 필드를 UTC 로 간주해 태양황경을 푼다(core/four-pillars.js:56-88).
    #   KST 러너에서 돌리면 절기가 9시간 밀려 절입 경계 케이스가 틀린 채로 통과한다.
    #   검증: lib/saju-solar-terms.golden.test.ts (발행 만세력 대조)
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: 타입 체크
        run: npx tsc --noEmit
      - name: 테스트 (사실 정합성 대조 포함)
        run: npm test

      # ★표시 계층 계산 금지 게이트 (D-14 재발 방지)
      #   화면이 원국을 다시 계산하던 구조 때문에 서버 분석값과 6개월간 갈라진 사고가 있었다.
      #   Next 15 는 `next build` 가 lint 를 돌려 배포를 막지만 **Next 16 에서 그 동작이 사라진다** —
      #   버전과 무관하게 잠금을 유지하려면 여기가 본진이다.
      - name: 린트 (표시 계층 계산 import 차단)
        run: npm run lint

      # 자물쇠를 끄는 주석이 새로 생기면 잡는다. 기존 42건은 전부 exhaustive-deps·no-img-element 라
      # 이 검사의 baseline 은 0 이다(규칙명 없는 bare disable 도 함께 막는다).
      - name: 차단 규칙 우회 감시
        run: |
          NAMED=$(grep -rn "eslint-disable[^\"']*no-restricted-imports" app components lib hooks store types || true)
          BARE=$(grep -rnE "eslint-disable(-next-line|-line)?( *\*/| *$)" app components lib hooks store types || true)
          if [ -n "$NAMED" ] || [ -n "$BARE" ]; then
            echo "$NAMED"; echo "$BARE"
            echo "::error::차단 규칙 우회(eslint-disable) 발견 — 서버 스냅샷·서버 액션 경로를 쓸 것"
            exit 1
          fi
          echo "우회 주석 0건"
