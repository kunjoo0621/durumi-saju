<!doctype html>
<html lang="ko" data-auth="in">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>두루미 서비스 메뉴 — 세로 리스트 · 새 디자인 톤</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        background: { primary: "rgb(9 9 11)", secondary: "rgb(20 20 20)", tertiary: "rgb(39 39 42)" },
        text: { primary: "rgb(255 255 255)", secondary: "rgb(161 161 170)", tertiary: "rgb(140 140 150)" },
        primary: { DEFAULT: "rgb(244 63 94)", hover: "rgb(251 113 133)", kakao: "rgb(254 229 0)" },
        saju: { wood: "rgb(34 197 94)" },
      },
      fontFamily: { aggro: ["SBAggroM", "Pretendard", "sans-serif"] },
    }},
  };
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  @font-face { font-family:"SBAggroM"; src:url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/SBAggroM.woff") format("woff"); font-display:swap; }
  :root { color-scheme: dark; }
  html, body { background:#050507; }
  body { font-family:"Pretendard",-apple-system,system-ui,"Apple SD Gothic Neo",sans-serif; -webkit-font-smoothing:antialiased; }
  .font-aggro { font-family:"SBAggroM","Pretendard",sans-serif; }
  .break-keep { word-break: keep-all; }
  .press { transition: transform .18s cubic-bezier(.34,1.56,.64,1), background-color .2s; }
  .press:active { transform: scale(.98); }
  .slot { position:relative; display:grid; place-items:center; border:2px dashed rgb(255 255 255 / .14); background:rgb(255 255 255 / .04); color:rgb(140 140 150); }
</style>
</head>
<body class="min-h-screen text-text-primary">

<div class="mx-auto w-full max-w-[440px] min-h-screen bg-background-primary relative overflow-hidden">
  <div class="pointer-events-none absolute -top-28 left-1/2 -translate-x-1/2 h-[300px] w-[300px] rounded-full blur-[100px] bg-primary/[0.12]"></div>

  <!-- Header (뒤로 + 가운데 타이틀 + 알잔액 + 햄버거) -->
  <header class="sticky top-0 z-[100] bg-background-primary px-5 py-4">
    <div class="flex items-center">
      <div class="flex-1 flex justify-start">
        <button class="w-10 h-10 grid place-items-center rounded-lg text-text-primary press" aria-label="뒤로"><svg viewBox="0 0 256 256" fill="currentColor" width="20" height="20"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg></button>
      </div>
      <div class="font-aggro text-[19px] text-text-primary shrink-0">사주보는 두루미</div>
      <div class="flex-1 flex items-center justify-end gap-2">
        <span class="flex items-center gap-1 text-[13px] font-semibold px-2.5 py-1 rounded-lg text-text-secondary bg-white/[0.06]"><svg viewBox="0 0 256 256" fill="currentColor" width="14" height="14"><path d="M128,232a72,72,0,0,1-72-72c0-24.7,10.9-56.9,28.5-84C102.2,49.3,116.3,40,128,40s25.8,9.3,43.5,36c17.6,27.1,28.5,59.3,28.5,84A72,72,0,0,1,128,232Z"/></svg>40</span>
        <button class="w-10 h-10 grid place-items-center rounded-lg text-text-primary press" aria-label="메뉴"><svg viewBox="0 0 256 256" fill="currentColor" width="22" height="22"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg></button>
      </div>
    </div>
  </header>

  <main class="px-5 pt-6 pb-12">
    <div class="mb-5">
      <p class="text-[12px] font-medium text-text-tertiary">알 하나면 충분해요</p>
      <h1 class="font-aggro text-[24px]">무엇을 볼까요?</h1>
    </div>

    <div class="divide-y divide-white/8">
      <!-- 사주 -->
      <button class="press flex w-full items-center gap-4 py-4 text-left">
        <div class="min-w-0 flex-1">
          <span class="text-[11px] font-semibold text-text-secondary">평생 사주</span>
          <h3 class="mt-0.5 text-[18px] font-bold leading-tight">내 사주 분석</h3>
          <p class="mt-1 text-[13px] text-text-secondary leading-snug break-keep">타고난 기질과 운의 흐름을 5가지 운으로 풀어봐요</p>
          <p class="mt-2 flex items-center gap-1 text-[15px] font-bold"><svg viewBox="0 0 256 256" fill="currentColor" width="15" height="15"><path d="M128,232a72,72,0,0,1-72-72c0-24.7,10.9-56.9,28.5-84C102.2,49.3,116.3,40,128,40s25.8,9.3,43.5,36c17.6,27.1,28.5,59.3,28.5,84A72,72,0,0,1,128,232Z"/></svg>10알</p>
        </div>
        <div class="slot shrink-0 overflow-hidden rounded-xl" style="width:92px; aspect-ratio:4/5"><span class="text-[9px]">4:5</span></div>
      </button>

      <!-- 펫 (NEW) -->
      <button class="press flex w-full items-center gap-4 py-4 text-left">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5">
            <span class="text-[11px] font-semibold text-text-secondary">반려동물 궁합</span>
            <span class="rounded-md bg-saju-wood px-1.5 py-0.5 text-[10px] font-bold text-background-primary">NEW</span>
          </div>
          <h3 class="mt-0.5 text-[18px] font-bold leading-tight">우리 아이와 궁합</h3>
          <p class="mt-1 text-[13px] text-text-secondary leading-snug break-keep">우리 아이와 나, 얼마나 잘 맞는지 봐요</p>
          <p class="mt-2 flex items-center gap-1 text-[15px] font-bold"><svg viewBox="0 0 256 256" fill="currentColor" width="15" height="15"><path d="M128,232a72,72,0,0,1-72-72c0-24.7,10.9-56.9,28.5-84C102.2,49.3,116.3,40,128,40s25.8,9.3,43.5,36c17.6,27.1,28.5,59.3,28.5,84A72,72,0,0,1,128,232Z"/></svg><span class="text-text-tertiary line-through text-[13px]">15</span> 8알</p>
        </div>
        <div class="slot shrink-0 overflow-hidden rounded-xl" style="width:92px; aspect-ratio:4/5"><span class="text-[9px]">4:5</span></div>
      </button>

      <!-- 오늘 -->
      <button class="press flex w-full items-center gap-4 py-4 text-left">
        <div class="min-w-0 flex-1">
          <span class="text-[11px] font-semibold text-text-secondary">7월 17일</span>
          <h3 class="mt-0.5 text-[18px] font-bold leading-tight">오늘의 운세</h3>
          <p class="mt-1 text-[13px] text-text-secondary leading-snug break-keep">오늘 일진과 내 사주가 만나는 지점을 짚어봐요</p>
          <p class="mt-2 flex items-center gap-1 text-[15px] font-bold"><svg viewBox="0 0 256 256" fill="currentColor" width="15" height="15"><path d="M128,232a72,72,0,0,1-72-72c0-24.7,10.9-56.9,28.5-84C102.2,49.3,116.3,40,128,40s25.8,9.3,43.5,36c17.6,27.1,28.5,59.3,28.5,84A72,72,0,0,1,128,232Z"/></svg>5알</p>
        </div>
        <div class="slot shrink-0 overflow-hidden rounded-xl" style="width:92px; aspect-ratio:4/5"><span class="text-[9px]">4:5</span></div>
      </button>

      <!-- 배틀 -->
      <button class="press flex w-full items-center gap-4 py-4 text-left">
        <div class="min-w-0 flex-1">
          <span class="text-[11px] font-semibold text-text-secondary">둘이서</span>
          <h3 class="mt-0.5 text-[18px] font-bold leading-tight">사주 배틀</h3>
          <p class="mt-1 text-[13px] text-text-secondary leading-snug break-keep">두 사람 사주를 나란히 놓고 궁합을 겨뤄봐요</p>
          <p class="mt-2 flex items-center gap-1 text-[15px] font-bold"><svg viewBox="0 0 256 256" fill="currentColor" width="15" height="15"><path d="M128,232a72,72,0,0,1-72-72c0-24.7,10.9-56.9,28.5-84C102.2,49.3,116.3,40,128,40s25.8,9.3,43.5,36c17.6,27.1,28.5,59.3,28.5,84A72,72,0,0,1,128,232Z"/></svg>20알</p>
        </div>
        <div class="slot shrink-0 overflow-hidden rounded-xl" style="width:92px; aspect-ratio:4/5"><span class="text-[9px]">4:5</span></div>
      </button>

      <!-- 올해 -->
      <button class="press flex w-full items-center gap-4 py-4 text-left">
        <div class="min-w-0 flex-1">
          <span class="text-[11px] font-semibold text-text-secondary">2026년</span>
          <h3 class="mt-0.5 text-[18px] font-bold leading-tight">올해 운세</h3>
          <p class="mt-1 text-[13px] text-text-secondary leading-snug break-keep">올해 남은 흐름을 월별로 미리 봐요</p>
          <p class="mt-2 flex items-center gap-1 text-[15px] font-bold"><svg viewBox="0 0 256 256" fill="currentColor" width="15" height="15"><path d="M128,232a72,72,0,0,1-72-72c0-24.7,10.9-56.9,28.5-84C102.2,49.3,116.3,40,128,40s25.8,9.3,43.5,36c17.6,27.1,28.5,59.3,28.5,84A72,72,0,0,1,128,232Z"/></svg>15알</p>
        </div>
        <div class="slot shrink-0 overflow-hidden rounded-xl" style="width:92px; aspect-ratio:4/5"><span class="text-[9px]">4:5</span></div>
      </button>
    </div>
  </main>
</div>
</body>
</html>
